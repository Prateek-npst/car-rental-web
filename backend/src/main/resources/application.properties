spring.application.name=backend
server.servlet.context-path=/api
server.port=8081

app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}

spring.datasource.url=jdbc:h2:mem:car_rental_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
